name: OrangeFox - Build

concurrency:
  group: pipa-orangefox-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/sairajkandkar007/orangefox_device_xiaomi_pipa'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/xiaomi/pipa'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'pipa'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
      LDCHECK:
        description: 'Path of blobs to check'
        required: true
        default: 'vendor/bin/qseecomd'
      RECOVERY_TAR:
        description: 'Release recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        type: boolean
        required: true
        default: false

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH || '12.1' }}
      DEVICE_TREE: ${{ github.event.inputs.DEVICE_TREE || 'https://github.com/sairajkandkar007/orangefox_device_xiaomi_pipa' }}
      DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH || 'main' }}
      DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH || 'device/xiaomi/pipa' }}
      DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME || 'pipa' }}
      BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET || 'boot' }}
      LDCHECK: ${{ github.event.inputs.LDCHECK || 'vendor/bin/qseecomd' }}
      RECOVERY_TAR: ${{ github.event.inputs.RECOVERY_TAR || 'false' }}
      RECOVERY_INSTALLER: ${{ github.event.inputs.RECOVERY_INSTALLER || 'false' }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Display Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Displaying variables/inputs."
        echo "Include Recovery Installer: ${{ env.RECOVERY_INSTALLER }}"
        echo "Release recovery.tar For Samsung devices: ${{ env.RECOVERY_TAR }}"
        echo "::endgroup::"

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Build Environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        git clone --depth=1 https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest (shallow sync)
      if: env.MANIFEST_BRANCH == '12.1'
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "OrangeFox Builder"
        git config --global user.email "actions@github.com"
        git clone --depth=1 https://gitlab.com/OrangeFox/sync.git
        cd sync

        # Configure repo init for depth-1 project checkouts, then sync only
        # each project's current manifest branch. --depth belongs to repo init.
        if ! grep -qE 'repo[[:space:]]+init' orangefox_sync.sh || ! grep -qE 'repo[[:space:]]+sync' orangefox_sync.sh; then
          echo "Could not locate repo init/repo sync commands in orangefox_sync.sh"
          exit 1
        fi
        sed -i -E '/^[[:space:]]*#/! s/(repo[[:space:]]+init)([[:space:]]|$)/\1 --depth=1 --current-branch --no-tags\2/g' orangefox_sync.sh
        sed -i -E '/^[[:space:]]*#/! s/(repo[[:space:]]+sync)([[:space:]]|$)/\1 -c\2/g' orangefox_sync.sh

        ./orangefox_sync.sh --branch ${{ env.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ env.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ env.MANIFEST_BRANCH }}
        mkdir -p "$(dirname "${{ env.DEVICE_PATH }}")"
        git clone --depth=1 --single-branch -b ${{ env.DEVICE_TREE_BRANCH }} ${{ env.DEVICE_TREE }} ${{ env.DEVICE_PATH }}
        cd ${{ env.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ env.MANIFEST_BRANCH }}
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        export FOX_BUILD_DEVICE=pipa
        lunch twrp_pipa-eng
        make clean
        mka adbd ${{ env.BUILD_TARGET }}image

    - name: Set Build Date # Output will be use in Release
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ env.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
            DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Check if Recovery Exist
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ env.MANIFEST_BRANCH }}
        OUTPUT_DIR="out/target/product/${{ env.DEVICE_NAME }}"
        if ! compgen -G "${OUTPUT_DIR}/OrangeFox*.img" > /dev/null; then
            OUTPUT_DIR="${OUTPUT_DIR}/target/product/${{ env.DEVICE_NAME }}"
        fi
        IMAGE=$(compgen -G "${OUTPUT_DIR}/OrangeFox*.img" | head -n 1 || true)
        if [ -z "${IMAGE}" ] || [ ! -s "${IMAGE}" ]; then
            echo "No non-empty OrangeFox image found for ${{ env.DEVICE_NAME }}."
            find "out/target/product/${{ env.DEVICE_NAME }}" -maxdepth 4 -type f -printf '%p (%s bytes)\\n' || true
            exit 1
        fi
        echo "CHECK_IMG_IS_OK=true" >> "$GITHUB_ENV"
        echo "FILE_PATH=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ env.MANIFEST_BRANCH }}/${OUTPUT_DIR}" >> "$GITHUB_ENV"
        echo "MD5_IMG=$(md5sum "${IMAGE}" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

    - name: Rename the Recovery
      run: |
        cd ${{ env.FILE_PATH }}/
        if [ "${{ env.BUILD_TARGET }}" = "boot" ]; then
          mv OrangeFox*.img boot.img
          echo "RECOVERY_TYPE=boot" >> $GITHUB_ENV
          echo "boot.img file found!"
        elif [ "${{ env.BUILD_TARGET }}" = "recovery" ]; then
          mv OrangeFox*.img recovery.img
          echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV
          echo "recovery.img file found!"
        elif [ "${{ env.BUILD_TARGET }}" = "vendorboot" ]; then
          mv OrangeFox*.img vendor_boot.img
          echo "RECOVERY_TYPE=vendor_boot" >> $GITHUB_ENV
          echo "vendor_boot.img file found!"
        else
          echo "No Recovery file found!"
          exit 1
        fi

    - name: Include Recovery Installer
      if: env.RECOVERY_INSTALLER == 'true'
      run: |
        cd ${{ env.FILE_PATH }}/
        wget https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip
        zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img
      continue-on-error: true

    - name: Recovery to tar for Samsung devices
      if: env.RECOVERY_TAR == 'true'
      run: |
        cd ${{ env.FILE_PATH }}/
        tar -cvf ${{ env.RECOVERY_TYPE }}.tar ${{ env.RECOVERY_TYPE }}.img
      continue-on-error: true

    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
          ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.tar
          ${{ env.FILE_PATH }}/recovery-installer.zip
          ${{ env.FILE_PATH }}/OrangeFox*.zip
        name: Unofficial OrangeFox for ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: ${{ env.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ env.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.

    - name: Release ramdisk-recovery
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
      with:
        files: |
          ${{ env.FILE_PATH }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
          ${{ env.FILE_PATH }}/ramdisk-recovery.*
        name: Unofficial OrangeFox for ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Target: ${{ env.RECOVERY_TYPE }}.img
          Build: ${{ env.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ env.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
          MD5 (img): ${{ env.MD5_IMG }}

    - name: Run LDCheck
      if: env.CHECK_IMG_IS_OK == 'true'
      run: |
        set -e
        curl -fsSL https://raw.githubusercontent.com/kinguser981/OrangeFox-Recovery-Builder-2024/OrangeFox/tools/ldcheck -o "${RUNNER_TEMP}/ldcheck"
        chmod +x "${RUNNER_TEMP}/ldcheck"
        cd "${{ env.FILE_PATH }}/recovery/root"
        python3 "${RUNNER_TEMP}/ldcheck" -p system/lib64:vendor/lib64:system/lib:vendor/lib "${{ env.LDCHECK }}"
        echo "LDCheck completed for ${{ env.LDCHECK }}."
      continue-on-error: true
