name: Analyze Pipa recovery WLAN gaps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Pipa firmware release tag (blank = latest)"
        required: false
        type: string
        default: ""
  push:
    paths:
      - "BoardConfig.mk"
      - "device.mk"
      - "fox_pipa.mk"
      - "recovery/root/**"
      - ".github/workflows/analyze-pipa-wlan-gaps.yml"

permissions:
  contents: write

concurrency:
  group: pipa-wlan-gap-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Pipa recovery tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install firmware analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs erofs-utils android-sdk-libsparse-utils file python3 python3-pip binutils kmod cpio aria2 jq binwalk p7zip-full mtools dosfstools procps libfontconfig1-dev liblzma-dev squashfs-tools lz4 device-tree-compiler

      - name: Set up Go for LP tools
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install lpunpack
        run: |
          set -euo pipefail
          go install github.com/soe1hom-arch/lpunpack@v1.0.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/lpunpack" --help || true

      - name: Install MagiskBoot
        run: |
          set -euo pipefail
          mkdir -p tools
          # Pin the standalone Linux x86_64 build to a fixed upstream mirror commit.
          MAGISKBOOT_URL="https://raw.githubusercontent.com/Uevo001/magiskboot-linux/f6a1cb6b584088060261316416b16abb939c6b02/x86_64/magiskboot"
          curl --fail --location --retry 3 --retry-all-errors "$MAGISKBOOT_URL" -o tools/magiskboot
          chmod 0755 tools/magiskboot
          file tools/magiskboot
          ./tools/magiskboot 2>&1 | head -n 20 || true
      - name: Download official Xiaomi Pipa fastboot ROM at high speed
        id: firmware
        run: |
          set -euo pipefail
          mkdir -p reports firmware analysis/vendor analysis/odm analysis/system analysis/system_ext analysis/product analysis/vendor_dlkm analysis/system_dlkm analysis/odm_dlkm analysis/boot analysis/vendor_boot
          printf "# Pipa WLAN gap analysis\\n\\nOfficial Xiaomi ROM download has not completed. See workflow logs.\\n" > reports/PIPA_WLAN_GAP_ANALYSIS.md

          # Official India fastboot package for Xiaomi Pad 6 (pipa).
          # Use the Xiaomi OTA Singapore OSS endpoint supplied for this ROM package.
          ROM_VERSION="OS2.0.14.0.UMZINXM"
          ROM_FILE="pipa_in_global_images_OS2.0.14.0.UMZINXM_20260414.0000.00_14.0_in_2a8218ddf5.tgz"
          ROM_MD5="2a8218ddf55d55edba81a0075d082bea"
          ROM_URL="https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/${ROM_VERSION}/${ROM_FILE}"

          echo "tag=${ROM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_url=${ROM_URL}" >> "$GITHUB_OUTPUT"
          echo "Downloading official Xiaomi CDN package: ${ROM_FILE}"
          aria2c --max-connection-per-server=16 --split=16 --min-split-size=1M --file-allocation=none --continue=true --max-tries=10 --retry-wait=5 --connect-timeout=30 --timeout=120 --summary-interval=10 --check-integrity=true --console-log-level=notice --dir=firmware --out="${ROM_FILE}" "${ROM_URL}"

          echo "${ROM_MD5}  ${ROM_FILE}" | (cd firmware && md5sum -c -)
          printf '%s\\n' "${ROM_FILE}" > firmware/release-assets.txt
          printf 'Official Xiaomi CDN URL: %s\\n' "${ROM_URL}" > firmware/source.txt

          mkdir -p firmware/xiaomi_fastboot_rom
          echo "Extracting full fastboot TGZ archive"
          tar -xzf "firmware/${ROM_FILE}" -C firmware/xiaomi_fastboot_rom

          # Make every image available to the existing partition analyzers.
          # Keep the original archive tree intact as well.
          while IFS= read -r -d '' image; do
            name="$(basename "$image")"
            [ -e "firmware/$name" ] || cp --reflink=auto "$image" "firmware/$name"
          done < <(find firmware/xiaomi_fastboot_rom -type f -name '*.img' -print0)

          find firmware/xiaomi_fastboot_rom -type f -name '*.img' -printf '%f\\n' | sort > firmware/rom-image-list.txt
          echo "Extracted image count: $(wc -l < firmware/rom-image-list.txt)"
          [ -s firmware/rom-image-list.txt ] || { echo "::error::No partition images found in Xiaomi fastboot archive"; exit 1; }

      - name: Reassemble ROM images and unpack every super partition
        run: |
          set -euo pipefail
          # Join every split image in numeric order.
          while IFS= read -r first; do
            base="${first%.part*}"
            [ -f "$base" ] && continue
            mapfile -t chunks < <(find firmware -maxdepth 1 -type f -name "$(basename "$base").part*" | sort -V)
            if [ "${#chunks[@]}" -gt 0 ]; then
              echo "Reassembling $(basename "$base") from ${#chunks[@]} pieces"
              cat "${chunks[@]}" > "$base"
            fi
          done < <(find firmware -maxdepth 1 -type f -name '*.img.part*' | sort -V)
          mkdir -p analysis/super
          if [ -f firmware/super.img ]; then
            super_input=firmware/super.img
            sparse_magic="$(od -An -tx1 -N4 "$super_input" | tr -d ' \n')"
            if [ "$sparse_magic" = "3aff26ed" ]; then
              echo "Converting sparse super.img to raw"
              simg2img "$super_input" firmware/super_raw.img
              super_input=firmware/super_raw.img
            fi
            echo "Unpacking dynamic partitions from super.img"
            lpunpack "$super_input" analysis/super
            # Extract every logical partition emitted by lpunpack, including
            # partitions not specifically named by the WLAN audit.
            for image in analysis/super/*.img; do
              [ -f "$image" ] || continue
              name="$(basename "$image" .img)"
              name="${name%_a}"
              out="analysis/partitions/$name"
              mkdir -p "$out"
              magic="$(od -An -tx1 -N4 "$image" | tr -d ' \n')"
              if [ "$magic" = "3aff26ed" ]; then
                raw="firmware/${name}_super_raw.img"
                simg2img "$image" "$raw"
                image="$raw"
              fi
              erofs_magic="$(od -An -tx4 -j1024 -N4 "$image" 2>/dev/null | tr -d ' \n' || true)"
              if [ "$erofs_magic" = "e0f5e1e2" ]; then
                tmp="${out}.extract"
                rm -rf "$tmp"; mkdir -p "$tmp"
                if fsck.erofs --extract="$tmp" "$image"; then
                  sudo find "$tmp" -type d -exec chmod 755 {} + 2>/dev/null || true
                  sudo find "$tmp" -type f -exec chmod 644 {} + 2>/dev/null || true
                  rmdir "$out" 2>/dev/null || true
                  mv "$tmp" "$out"
                else
                  echo "::warning::EROFS extraction failed for $name"
                  rm -rf "$tmp"
                fi
              elif file "$image" | grep -qi 'ext[234] filesystem'; then
                sudo mount -o loop,ro,noload "$image" "$out" || echo "::warning::Could not mount $name"
              else
                echo "Retained raw logical partition: $name ($(file -b "$image"))"
              fi
            done
          else
            echo "::warning::Complete ROM download did not include super.img"
          fi
          # Inventory every downloaded image, including boot-chain, modem,
          # persist, cust and other non-dynamic partitions.
          find firmware -maxdepth 1 -type f -name '*.img' -printf '%f\t%s bytes\n' | sort > analysis/rom-image-inventory.txt
          find analysis/super -maxdepth 1 -type f -name '*.img' -printf '%f\t%s bytes\n' | sort > analysis/super-partition-inventory.txt

      - name: Extract available Android filesystem partitions
        run: |
          set -euo pipefail
          for part in vendor odm system system_ext product vendor_dlkm system_dlkm odm_dlkm; do
            image="firmware/${part}_a.img"
            [ -f "$image" ] || image="firmware/${part}.img"
            [ -f "$image" ] || continue
            mkdir -p "analysis/$part"
            # The same logical partition may already have been extracted from
            # super.img. Never extract over an existing tree: fsck.erofs fails
            # on duplicate files and leaves the audit half-finished.
            if [ -n "$(find "analysis/$part" -mindepth 1 -print -quit 2>/dev/null)" ]; then
              echo "$part already populated from super.img; skipping duplicate extraction"
              continue
            fi
            magic="$(od -An -tx1 -N4 "$image" | tr -d ' \\n')"
            if [ "$magic" = "3aff26ed" ]; then
              simg2img "$image" "firmware/${part}_raw.img"
              image="firmware/${part}_raw.img"
            fi
            echo "$part: $(file -b "$image")"
            erofs_magic="$(od -An -tx4 -j1024 -N4 "$image" 2>/dev/null | tr -d ' \\n' || true)"
            if [ "$erofs_magic" = "e0f5e1e2" ]; then
              extract_dir="analysis/${part}.extract"
              rm -rf "$extract_dir"
              mkdir -p "$extract_dir"
              if fsck.erofs --extract="$extract_dir" "$image"; then
                sudo find "$extract_dir" -type d -exec chmod 755 {} + 2>/dev/null || true
                sudo find "$extract_dir" -type f -exec chmod 644 {} + 2>/dev/null || true
                rmdir "analysis/$part" 2>/dev/null || true
                mv "$extract_dir" "analysis/$part"
              else
                echo "::warning::Could not extract EROFS partition $part"
                rm -rf "$extract_dir"
              fi
            else
              sudo mount -o loop,ro,noload "$image" "analysis/$part" || echo "::warning::Could not mount partition $part"
            fi
          done
          # Extract every standalone filesystem image in the fastboot ROM,
          # not just the partitions required by the WLAN checks.
          mkdir -p analysis/standalone
          for image in firmware/*.img; do
            [ -f "$image" ] || continue
            base="$(basename "$image" .img)"
            case "$base" in super|super_raw|*_raw) continue ;; esac
            out="analysis/standalone/$base"
            [ -n "$(find "$out" -mindepth 1 -print -quit 2>/dev/null || true)" ] && continue
            mkdir -p "$out"
            magic="$(od -An -tx4 -j1024 -N4 "$image" 2>/dev/null | tr -d ' \n' || true)"
            if [ "$magic" = "e0f5e1e2" ]; then
              tmp="${out}.extract"; rm -rf "$tmp"; mkdir -p "$tmp"
              if fsck.erofs --extract="$tmp" "$image"; then
                sudo find "$tmp" -type d -exec chmod 755 {} + 2>/dev/null || true
                sudo find "$tmp" -type f -exec chmod 644 {} + 2>/dev/null || true
                rmdir "$out" 2>/dev/null || true; mv "$tmp" "$out"
              else
                echo "::warning::Could not extract EROFS image $base"
                rm -rf "$tmp"
              fi
            elif file "$image" | grep -qi 'ext[234] filesystem'; then
              sudo mount -o loop,ro,noload "$image" "$out" || echo "::warning::Could not mount ext image $base"
            else
              rmdir "$out" 2>/dev/null || true
              echo "Non-filesystem image retained: $base"
            fi
          done

      - name: Extract and inspect modem firmware partition read-only
        id: modem
        run: |
          set -euo pipefail
          mkdir -p analysis/modem/images analysis/modem/extracted analysis/modem/binwalk
          : > analysis/modem/modem-image-candidates.txt
          : > analysis/modem/modem-extraction.log

          # Search the original fastboot archive and the flattened image directory.
          # Deliberately exclude modemst*, fsg, persist and other NV/EFS partitions.
          while IFS= read -r -d '' image; do
            base="$(basename "$image")"
            lower="$(printf '%s' "$base" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              modem.img|modem_a.img|modem_b.img|non-hlos.bin|non-hlos.img)
                dest="analysis/modem/images/$base"
                if [ ! -e "$dest" ]; then cp --reflink=auto "$image" "$dest"; fi
                ;;
            esac
          done < <(find firmware firmware/xiaomi_fastboot_rom -type f \( -iname 'modem.img' -o -iname 'modem_a.img' -o -iname 'modem_b.img' -o -iname 'non-hlos.bin' -o -iname 'non-hlos.img' \) -print0 2>/dev/null | sort -zu)

          shopt -s nullglob
          candidates=(analysis/modem/images/*)
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "No modem.img/modem_a.img/modem_b.img/NON-HLOS image found in this fastboot package." | tee -a analysis/modem/modem-extraction.log
          fi

          for source in "${candidates[@]}"; do
            base="$(basename "$source")"
            echo "===== $base =====" | tee -a analysis/modem/modem-extraction.log
            file "$source" | tee -a analysis/modem/modem-extraction.log
            sha256sum "$source" | tee -a analysis/modem/modem-extraction.log
            image="$source"

            sparse_magic="$(od -An -tx1 -N4 "$image" | tr -d ' \n')"
            if [ "$sparse_magic" = "3aff26ed" ]; then
              raw="analysis/modem/images/${base%.*}_raw.img"
              echo "Android sparse image detected; converting to raw: $raw" | tee -a analysis/modem/modem-extraction.log
              simg2img "$image" "$raw"
              image="$raw"
              file "$image" | tee -a analysis/modem/modem-extraction.log
            fi

            out="analysis/modem/extracted/${base%.*}"
            mkdir -p "$out"
            erofs_magic="$(od -An -tx4 -j1024 -N4 "$image" 2>/dev/null | tr -d ' \n' || true)"
            if [ "$erofs_magic" = "e0f5e1e2" ]; then
              echo "EROFS filesystem detected; extracting without mounting." | tee -a analysis/modem/modem-extraction.log
              if ! fsck.erofs --extract="$out" "$image" >> analysis/modem/modem-extraction.log 2>&1; then
                echo "EROFS extraction failed for $base" | tee -a analysis/modem/modem-extraction.log
              fi
            elif file "$image" | grep -Eqi 'ext[234] filesystem'; then
              echo "ext filesystem detected; mounting read-only with noload." | tee -a analysis/modem/modem-extraction.log
              mountpoint="$out.mount"
              mkdir -p "$mountpoint"
              if sudo mount -o loop,ro,noload "$image" "$mountpoint"; then
                sudo cp -a "$mountpoint/." "$out/"
                sudo umount "$mountpoint"
                rmdir "$mountpoint" 2>/dev/null || true
              else
                echo "Read-only ext mount failed for $base" | tee -a analysis/modem/modem-extraction.log
              fi
            else
              rmdir "$out" 2>/dev/null || true
              if file "$image" | grep -Eqi 'FAT(12|16|32)|DOS/MBR'; then
                echo "FAT/MBR modem container detected; attempting read-only mtools extraction." | tee -a analysis/modem/modem-extraction.log
                mkdir -p "$out"
                image_spec="$image"
                if ! mdir -i "$image_spec" ::/ > "analysis/modem/fat-root-listing.txt" 2>&1; then
                  python3 - "$image" <<'PY' > analysis/modem/fat-offset-candidates.txt
          import sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()[:512]
          if len(data) >= 512 and data[510:512] == b"\\x55\\xaa":
              for i in range(4):
                  entry = data[446 + 16*i:462 + 16*i]
                  ptype = entry[4]
                  start = int.from_bytes(entry[8:12], "little")
                  count = int.from_bytes(entry[12:16], "little")
                  if ptype and start and count:
                      for sector in (512, 4096):
                          print(start * sector)
          PY
                  while IFS= read -r offset; do
                    [ -n "$offset" ] || continue
                    candidate="$image@@$offset"
                    if mdir -i "$candidate" ::/ > "analysis/modem/fat-root-listing-$offset.txt" 2>&1; then
                      image_spec="$candidate"
                      echo "$offset" > analysis/modem/fat-selected-byte-offset.txt
                      break
                    fi
                  done < analysis/modem/fat-offset-candidates.txt
                fi
                if mdir -i "$image_spec" ::/ > analysis/modem/fat-selected-listing.txt 2>&1; then
                  mcopy -s -i "$image_spec" '::*' "$out/" > analysis/modem/fat-copy.stdout 2> analysis/modem/fat-copy.stderr || true
                else
                  echo "FAT extraction failed at byte zero and parsed MBR offsets." | tee -a analysis/modem/modem-extraction.log
                fi
              else
                echo "No top-level filesystem detected; running signature scan only." | tee -a analysis/modem/modem-extraction.log
                scan_dir="analysis/modem/binwalk/${base%.*}"
                mkdir -p "$scan_dir"
                # Extraction is confined to the GitHub runner and the modem image.
                # No modemst/fsg/NV partition is passed to binwalk.
                binwalk -eM --directory "$scan_dir" "$image" >> analysis/modem/modem-extraction.log 2>&1 || true
              fi
            fi
          done

          find analysis/modem -maxdepth 4 -type f -printf '%p\t%s bytes\n' | sort > analysis/modem/modem-file-list.txt
          echo "Modem image candidates: $(find analysis/modem/images -maxdepth 1 -type f | wc -l)"
          echo "Extracted modem files: $(find analysis/modem/extracted analysis/modem/binwalk -type f 2>/dev/null | wc -l)"


      - name: Inspect boot and vendor_boot images with MagiskBoot
        run: |
          set -euo pipefail
          for part in boot vendor_boot; do
            image="firmware/$part.img"
            [ -f "$image" ] || continue
            out="analysis/$part/unpacked"
            mkdir -p "$out"
            file "$image" | tee "analysis/$part/image-type.txt"
            if (cd "$out" && "$GITHUB_WORKSPACE/tools/magiskboot" unpack "$GITHUB_WORKSPACE/$image") >"analysis/$part/magiskboot.log" 2>&1; then
              echo "MagiskBoot successfully unpacked $part.img"
            else
              cat "analysis/$part/magiskboot.log"
              echo "::warning::MagiskBoot failed to unpack $part.img"
            fi
            if [ -f "$out/ramdisk.cpio" ]; then
              mkdir -p "$out/ramdisk"
              (cd "$out/ramdisk" && cpio -idm --quiet --no-absolute-filenames < ../ramdisk.cpio) || echo "::warning::Could not extract $part ramdisk cpio"
            fi
            if [ -f "$out/vendor_ramdisk.cpio" ]; then
              mkdir -p "$out/vendor_ramdisk"
              (cd "$out/vendor_ramdisk" && cpio -idm --quiet --no-absolute-filenames < ../vendor_ramdisk.cpio) || echo "::warning::Could not extract $part vendor ramdisk cpio"
            fi
          done
      - name: Deep-scan raw partition images for WLAN payloads
        run: |
          set -euo pipefail
          mkdir -p analysis/raw-partition-scan
          while IFS= read -r -d '' image; do
            base="$(basename "$image")"
            case "$base" in super.img|super_raw.img) continue ;; esac
            if file "$image" | grep -qiE 'EROFS filesystem|ext[234] filesystem|FAT(12|16|32)'; then
              continue
            fi
            out="analysis/raw-partition-scan/${base}.extracted"
            mkdir -p "$out"
            echo "Signature-scanning raw partition: $image"
            timeout 15m binwalk -eM --directory "$out" "$image" \
              > "analysis/raw-partition-scan/${base}.log" 2>&1 || true
          done < <(find firmware analysis/super -maxdepth 1 -type f \
                    \( -name '*.img' -o -name '*.bin' -o -name '*.mbn' \) -print0 | sort -zu)
          find analysis/raw-partition-scan -type f -printf '%p\\t%s bytes\\n' | sort \
            > analysis/raw-partition-scan-file-list.txt

      - name: Scan every extracted partition and collect all WLAN-related files
        id: collect_all_wlan
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import shutil
          from pathlib import Path

          roots = [
              Path("analysis/partitions"), Path("analysis/standalone"),
              Path("analysis/vendor"), Path("analysis/odm"),
              Path("analysis/system"), Path("analysis/system_ext"),
              Path("analysis/product"), Path("analysis/vendor_dlkm"),
              Path("analysis/system_dlkm"), Path("analysis/odm_dlkm"),
              Path("analysis/boot/unpacked"), Path("analysis/vendor_boot/unpacked"),
              Path("analysis/modem/extracted"), Path("analysis/modem/binwalk"),
              Path("analysis/raw-partition-scan"),
          ]
          exact = {
              "amss20.bin", "m3.bin", "wlan_mac.bin", "regdb.bin",
              "regdb_j11.bin", "wcnss_qcom_cfg.ini", "cnss-daemon",
              "wpa_supplicant", "hostapd", "libwifi-hal.so",
          }

          def is_wifi_related(p):
              name = p.name.lower()
              path = p.as_posix().lower()
              if "rmt_storage" in name:
                  return False
              if name in exact:
                  return True
              if name.startswith(("bd_", "bdwlan", "qca", "cnss", "wlan", "wifi", "wpa_", "hostapd")):
                  return True
              if name.endswith(".ko") and any(x in name for x in ("wlan", "wifi", "cnss", "qca")):
                  return True
              if name.startswith(("android.hardware.wifi.", "libwifi", "libwpa", "libqti-wifi")):
                  return True
              if any(x in path for x in ("/wifi/", "/wlan/", "/cnss/", "/qca6390/", "/qca_cld/")):
                  return True
              if name.endswith((".rc", ".ini", ".conf", ".xml")) and any(
                  x in path for x in ("wifi", "wlan", "cnss", "qca6390", "supplicant", "hostapd")
              ):
                  return True
              return any(x in name for x in ("wlan", "wifi", "cnss", "qca6390", "qca_cld", "supplicant", "hostapd"))

          destination = Path("stock-rom-wlan")
          destination.mkdir(parents=True, exist_ok=True)
          copied, skipped, seen = [], [], set()

          for root in roots:
              if not root.exists():
                  continue
              for src in root.rglob("*"):
                  if not src.is_file() or not is_wifi_related(src):
                      continue
                  try:
                      identity = (str(src.resolve()), src.stat().st_size)
                      if identity in seen:
                          continue
                      seen.add(identity)
                      if src.stat().st_size > 50 * 1024 * 1024:
                          skipped.append((str(src), "over 50 MiB repository safety limit"))
                          continue
                      relative = src.relative_to(root)
                      if root.name in ("partitions", "standalone") and len(relative.parts) > 1:
                          rel = Path(relative.parts[0]) / Path(*relative.parts[1:])
                      else:
                          rel = relative
                      out = destination / root.name / rel
                      out.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(src, out)
                      digest = hashlib.sha256(out.read_bytes()).hexdigest()
                      copied.append((str(src), str(out), out.stat().st_size, digest))
                  except (OSError, PermissionError) as exc:
                      skipped.append((str(src), str(exc)))

          copied.sort()
          lines = [
              "# Complete Pipa stock-ROM WLAN file collection", "",
              "Source: all extracted filesystem partitions, modem extraction trees, boot/vendor_boot ramdisks and raw-partition signature-extraction outputs from the official fastboot ROM.",
              "All candidates are preserved under stock-rom-wlan/ with source paths; the verified QCA6390 firmware subset and CNSS daemon are staged into recovery/root by a separate step.",
              "Collection uses WLAN/QCA/CNSS/supplicant/hostapd/board-data names and WLAN-related configuration paths.",
              "rmt_storage and modem NV/EFS partitions are excluded. Individual files larger than 50 MiB are skipped.",
              "", "| Original source | Repository copy | Bytes | SHA-256 |",
              "|---|---|---:|---|",
          ]
          for src, out, size, digest in copied:
              lines.append("| " + src + " | " + out + " | " + str(size) + " | " + digest + " |")
          if not copied:
              lines.append("| No matching WLAN files discovered | — | — | — |")
          lines += ["", "## Skipped candidates", ""]
          lines.extend("- " + p + " — " + reason for p, reason in skipped)
          lines += ["", "Collected: " + str(len(copied)), "Skipped: " + str(len(skipped)), ""]
          Path("reports").mkdir(exist_ok=True)
          Path("reports/PIPA_WLAN_STOCK_ROM_FILE_INVENTORY.md").write_text("\n".join(lines))
          print("Collected " + str(len(copied)) + " WLAN-related files; skipped " + str(len(skipped)) + ".")
          if not copied:
              raise SystemExit("No WLAN-related files were found across extracted partition roots.")
          PY

      - name: Stage verified QCA6390 firmware into recovery root
        run: |
          set -euo pipefail
          SRC="analysis/modem/extracted/NON-HLOS/image/qca6390"
          DST="recovery/root/vendor/firmware/wlan/qca_cld/qca6390"
          [ -d "$SRC" ] || { echo "::error::QCA6390 modem firmware extraction is missing: $SRC"; exit 1; }
          mkdir -p "$DST"

          # Copy only the QCA6390 firmware payload and board-data candidates.
          # Preserve every board-data variant; never guess the active board ID.
          find "$SRC" -maxdepth 1 -type f \
            \( -name 'amss20.bin' -o -name 'm3.bin' -o -name 'bdwlan.elf' \
               -o -name 'bdwlan.e*' -o -name 'bd_*.elf' -o -name 'regdb*.bin' \) \
            -exec install -m 0644 {} "$DST/" \;

          CFG=""
          for root in analysis/partitions/vendor analysis/standalone/vendor analysis/vendor; do
            [ -d "$root" ] || continue
            CFG="$(find "$root" -type f -path '*/etc/wifi/qca6390/WCNSS_qcom_cfg.ini' -print -quit)"
            [ -n "$CFG" ] && break
          done
          [ -n "$CFG" ] || { echo "::error::Stock QCA6390 WCNSS_qcom_cfg.ini was not found"; exit 1; }
          install -m 0644 "$CFG" "$DST/WCNSS_qcom_cfg.ini"

          # The stock CNSS daemon is the matching userspace companion for the
          # Qualcomm WLAN stack. Its dependency audit passed in the stock ROM.
          CNSS=""
          for root in analysis/partitions/vendor analysis/standalone/vendor analysis/vendor; do
            [ -d "$root" ] || continue
            [ -f "$root/bin/cnss-daemon" ] && { CNSS="$root/bin/cnss-daemon"; break; }
          done
          [ -n "$CNSS" ] || { echo "::error::Stock vendor cnss-daemon was not found"; exit 1; }
          install -D -m 0755 "$CNSS" recovery/root/vendor/bin/cnss-daemon

          for required in amss20.bin m3.bin bdwlan.elf regdb.bin WCNSS_qcom_cfg.ini; do
            [ -s "$DST/$required" ] || { echo "::error::Missing required QCA6390 payload: $required"; exit 1; }
          done
          BOARD_DATA_COUNT="$(find "$DST" -maxdepth 1 -type f \( -name 'bd_*.elf' -o -name 'bdwlan.e*' \) | wc -l)"
          [ "$BOARD_DATA_COUNT" -gt 0 ] || { echo "::error::No QCA6390 board-data variants were extracted"; exit 1; }

          cat > reports/PIPA_QCA6390_FIRMWARE_STAGING.md <<'EOF'
          # Pipa QCA6390 recovery firmware staging

          - Source: official Pipa fastboot ROM `OS2.0.14.0.UMZINXM`.
          - Recovery destination: `recovery/root/vendor/firmware/wlan/qca_cld/qca6390/`.
          - Includes the stock `amss20.bin`, `m3.bin`, `bdwlan.elf`, regulatory database, QCA6390 configuration, and all extracted `bd_*.elf` / `bdwlan.e*` board-data candidates.
          - Board-data variants are preserved without selecting or renaming one. Select the active variant only after confirming the runtime board ID.
          - `wlan_mac.bin` was not present in the extracted QCA6390 modem payload and is not fabricated.
          - The QCA6390 kernel module and vendor WLAN configuration already exist in the recovery tree. Module loading still requires matching the recovery kernel ABI.
          - This is file staging only; it does not prove firmware boot, driver initialization, scanning, or connectivity.
          EOF
          {
            echo
            echo "## Staged payload"
            echo
            find "$DST" -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort
            echo
            echo "Board-data candidates: $BOARD_DATA_COUNT"
            if [ -e "$DST/wlan_mac.bin" ]; then echo "wlan_mac.bin: present"; else echo "wlan_mac.bin: unavailable in extracted source"; fi
          } >> reports/PIPA_QCA6390_FIRMWARE_STAGING.md

      - name: Compare recovery tree with Pipa vendor WLAN stack
        env:
          FIRMWARE_TAG: ${{ steps.firmware.outputs.tag }}
          FIRMWARE_URL: ${{ steps.firmware.outputs.release_url }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import os, re, json, subprocess
          from pathlib import Path

          root = Path(".")
          # Resolve each Android partition to one populated extraction root.
          # lpunpack output lives under analysis/partitions/<name>; standalone
          # image extraction lives under analysis/standalone/<name>. Older
          # workflow versions also extracted directly under analysis/<name>.
          partition_names = ["vendor", "odm", "system", "system_ext", "product",
                             "vendor_dlkm", "system_dlkm", "odm_dlkm"]
          def populated(path):
              return path.is_dir() and next(path.iterdir(), None) is not None

          partition_roots = {}
          for name in partition_names:
              candidates = [
                  Path("analysis/partitions") / name,
                  Path("analysis/standalone") / name,
                  Path("analysis") / name,
              ]
              selected = next((p for p in candidates if populated(p)), None)
              if selected is not None:
                  partition_roots[name] = selected

          vendor = partition_roots.get("vendor", Path("analysis/vendor"))
          odm = partition_roots.get("odm", Path("analysis/odm"))
          all_fs_roots = list(dict.fromkeys(partition_roots.values()))
          recovery = Path("recovery/root")
          report = []
          findings = []

          def add(s=""):
              report.append(str(s))

          def check(label, ok, detail, severity="MISSING"):
              status = "PASS" if ok else severity
              add(f"| {label} | **{status}** | {detail} |")
              if not ok:
                  findings.append((severity, label, detail))

          def exists(rel):
              return (root / rel).exists()

          def vendor_exists(rel):
              return (vendor / rel).exists() or (odm / rel).exists()

          def text_file(path):
              try:
                  return path.read_text(errors="replace")
              except Exception:
                  return ""

          def elf_needed(path):
              try:
                  out = subprocess.check_output(["readelf", "-d", str(path)], text=True, stderr=subprocess.DEVNULL)
              except Exception:
                  return []
              return re.findall(r"Shared library: \[(.+?)\]", out)

          add("# Pipa OrangeFox WLAN gap analysis")
          add()
          add(f"- Firmware release: `{os.environ.get('FIRMWARE_TAG','unknown')}`")
          add(f"- Firmware: {os.environ.get('FIRMWARE_URL','')}")
          add("- Reference implementation: [Amethyst WLAN setup commit](https://github.com/chkndrp/device_xiaomi_amethyst-recovery/commit/d55207095b189045fb1e76008cd88dd0cd4979da)")
          add("- Scope: vendor/ODM plus available boot, vendor_boot, system, system_ext, product and DLKM partitions; current recovery tree; WLAN binaries/configuration/modules and ELF dependencies.")
          add("- This is a static compatibility audit. It does not prove that the driver loads or that Wi-Fi connects on hardware.")
          add()
          add("## Required tree integration")
          add()
          add("| Check | Result | Detail |")
          add("|---|---|---|")

          qcom_rc = text_file(recovery / "init.recovery.qcom.rc")
          wlan_rc = text_file(recovery / "init.recovery.wlan.rc")
          check("WLAN init import", "import init.recovery.wlan.rc" in qcom_rc,
                "init.recovery.qcom.rc must import init.recovery.wlan.rc")
          check("WLAN setup service declaration", exists("recovery/root/system/etc/init/wlan_setup.rc"),
                "The init service file must declare service wlan_setup; the trigger alone cannot start an undeclared service.")
          setup_rc = text_file(recovery / "system/etc/init/wlan_setup.rc")
          check("WLAN setup service executable path", "/system/bin/wlan_setup.sh" in setup_rc and exists("recovery/root/system/bin/wlan_setup.sh"),
                "wlan_setup.rc must point to the staged helper script.")
          check("WLAN setup trigger", "start wlan_setup" in wlan_rc,
                "init.recovery.wlan.rc should start wlan_setup after firmware mount.")
          check("Supplicant service declaration", exists("recovery/root/system/etc/init/wpa_supplicant.rc"),
                "A wpa_supplicant init service file must be present.")
          supp_rc = text_file(recovery / "system/etc/init/wpa_supplicant.rc")
          check("Supplicant executable", "/vendor/bin/hw/wpa_supplicant" in supp_rc and vendor_exists("bin/hw/wpa_supplicant"),
                "Service command must match the Pipa vendor supplicant path.")
          check("Wi-Fi feature flags", all(x in text_file(root / "BoardConfig.mk") for x in ["BOARD_WLAN_DEVICE := qcwcn","WIFI_DRIVER_DEFAULT := qca_cld3","BOARD_WPA_SUPPLICANT_DRIVER := NL80211"]) and "TW_INCLUDE_WIFI := true" in text_file(root / "device.mk") and "OF_ENABLE_WLAN := 1" in text_file(root / "fox_pipa.mk"),
                "Check BoardConfig.mk, device.mk and fox_pipa.mk feature flags.")

          add()
          add("## Pipa vendor/ODM files")
          add()
          add("| Check | Result | Detail |")
          add("|---|---|---|")
          expected = [
            ("QCA6390 kernel module", "lib/modules/qca_cld3_qca6390.ko"),
            ("QCA6490 candidate module", "lib/modules/qca_cld3_qca6490.ko"),
            ("Vendor supplicant", "bin/hw/wpa_supplicant"),
            ("CNSS daemon", "bin/cnss-daemon"),
            ("rmt_storage daemon", "bin/rmt_storage"),
            ("WPA config", "etc/wifi/wpa_supplicant.conf"),
            ("WPA overlay config", "etc/wifi/wpa_supplicant_overlay.conf"),
            ("Hostapd config", "etc/hostapd/hostapd_default.conf"),
            ("QCA6390 vendor WLAN config", "etc/wifi/qca6390/WCNSS_qcom_cfg.ini"),
            ("QCA6390 firmware config", "firmware/wlan/qca_cld/qca6390/WCNSS_qcom_cfg.ini"),
            ("QCA6390 MAC firmware", "firmware/wlan/qca_cld/qca6390/wlan_mac.bin"),
            ("QCA6490 firmware config", "firmware/wlan/qca_cld/qca6490/WCNSS_qcom_cfg.ini"),
            ("QCA6490 MAC firmware", "firmware/wlan/qca_cld/qca6490/wlan_mac.bin"),
            ("WLAN module dependency index", "lib/modules/modules.dep"),
          ]
          for label, rel in expected:
              ok = vendor_exists(rel)
              check(label, ok, f"Looked for vendor/{rel} or odm/{rel}.")

          add()
          add("### Recursive WLAN firmware/config search")
          add()
          add("| Partition | WLAN firmware/config matches |")
          add("|---|---|")
          asset_re = re.compile(r"(WCNSS.*\.(?:ini|mbn)|wlan_mac\.bin|bdwlan\.bin|\.(?:mbn|elf)$|/wlan/|/wifi/)", re.I)
          for part_name, part_root in partition_roots.items():
              hits = [str(p.relative_to(part_root)) for p in part_root.rglob("*") if p.is_file() and asset_re.search("/" + str(p.relative_to(part_root)))]
              add(f"| {part_name} | " + (", ".join(hits[:150]) if hits else "No filename matches") + " |")

          add()
          add("## Recovery staging and safety")
          add()
          add("| Check | Result | Detail |")
          add("|---|---|---|")
          ci_qca_fw = recovery / "vendor/firmware/wlan/qca_cld/qca6390"
          ci_fw_names = {p.name for p in ci_qca_fw.glob("*") if p.is_file()} if ci_qca_fw.is_dir() else set()
          check("CI QCA6390 firmware payload staged",
                {"amss20.bin", "m3.bin", "bdwlan.elf", "regdb.bin", "WCNSS_qcom_cfg.ini"}.issubset(ci_fw_names),
                "Verified payload and config files in analysis/recovery-firmware-stage; board-data variants are retained without guessing the active board ID.")
          check("QCA6390 board-data variants staged",
                any(n.startswith("bd_") and n.endswith(".elf") for n in ci_fw_names) and any(n.startswith("bdwlan.e") for n in ci_fw_names),
                "All extracted bd_*.elf and bdwlan.e* variants should be staged for later runtime board-ID selection.")
          check("QCA6390 wlan_mac.bin available", "wlan_mac.bin" in ci_fw_names,
                "The extracted NON-HLOS qca6390 directory did not provide wlan_mac.bin; do not fabricate it.", "REVIEW")
          for label, rel in [
            ("Staged WLAN module directory", "recovery/root/vendor/lib/modules"),
            ("Staged vendor supplicant", "recovery/root/vendor/bin/hw/wpa_supplicant"),
            ("Staged CNSS daemon", "recovery/root/vendor/bin/cnss-daemon"),
            ("Staged rmt_storage daemon", "recovery/root/vendor/bin/rmt_storage"),
            ("Staged WPA config", "recovery/root/vendor/etc/wifi/wpa_supplicant.conf"),
            ("Staged WLAN firmware", "recovery/root/vendor/firmware/wlan/qca_cld"),
          ]:
              check(label, exists(rel), f"Expected staged path: {rel}.")
          loader = text_file(recovery / "system/bin/wlan_setup.sh")
          check("Loader targets a single selected chipset", "qca_cld3_qca6390.ko" in loader and "qca_cld3_qca6490.ko" not in loader,
                "Do not automatically load both candidate drivers; verify the actual chipset first.")
          ro_wrapper = text_file(recovery / "vendor/bin/rmt_storage_ro.sh")
          check("rmt_storage read-only wrapper exists", bool(ro_wrapper),
                "Never start vendor rmt_storage directly without verifying its modem NV/EFS write behavior.")
          check("rmt_storage wrapper requests read-only loops", "losetup -frs" in ro_wrapper,
                "Wrapper should request read-only loop devices using losetup -r.")
          check("rmt_storage wrapper verifies read-only devices", '"/sys/class/block/$loop_name/ro"' in ro_wrapper or "'/sys/class/block/$loop_name/ro'" in ro_wrapper,
                "Wrapper must verify each loop device reports ro=1 before launching rmt_storage.")
          check("WLAN helper executable bit", os.access(recovery / "system/bin/wlan_setup.sh", os.X_OK),
                "wlan_setup.sh must be executable in Git.")
          check("rmt_storage helper executable bit", os.access(recovery / "vendor/bin/rmt_storage_ro.sh", os.X_OK),
                "rmt_storage_ro.sh must be executable in Git.")

          add()
          add("## ELF dependency audit")
          add()
          add("| Binary | Result | Detail |")
          add("|---|---|---|")
          # Include nested roots too: some images expose an extra system/ prefix.
          lib_roots = []
          for part in all_fs_roots:
              for libdir in ("lib64", "lib"):
                  lib_roots.extend(p for p in part.rglob(libdir) if p.is_dir())
          lib_roots = list(dict.fromkeys(lib_roots))
          staged_roots = [recovery / "vendor/lib64", recovery / "vendor/lib", recovery / "vendor/odm/lib64"]
          binaries = [
            ("wpa_supplicant", vendor / "bin/hw/wpa_supplicant"),
            ("cnss-daemon", vendor / "bin/cnss-daemon"),
            ("rmt_storage", vendor / "bin/rmt_storage"),
          ]
          for name, binary in binaries:
              if not binary.is_file():
                  check(f"{name} ELF dependencies", False, "Vendor binary is absent; dependency scan skipped.")
                  continue
              missing = []
              queue = [(binary, 0)]
              seen = set()
              while queue:
                  current, depth = queue.pop()
                  if current in seen or depth > 8:
                      continue
                  seen.add(current)
                  for soname in elf_needed(current):
                      if soname.startswith(("libc.so","libm.so","libdl.so","liblog.so","libbase.so","libutils.so","libc++.so")):
                          continue
                      candidates = [p / soname for p in lib_roots]
                      source = next((p for p in candidates if p.is_file()), None)
                      staged = any((p / soname).is_file() for p in staged_roots)
                      if source is None and not staged:
                          missing.append(soname)
                      elif source is not None:
                          queue.append((source, depth + 1))
              check(f"{name} ELF dependencies", not missing,
                    "No unresolved non-platform shared libraries found." if not missing else "Missing libraries: " + ", ".join(sorted(set(missing))))

          add()
          add("## Cross-partition WLAN inventory")
          add()
          add("| Partition | WLAN-related files found |")
          add("|---|---|")
          wlan_pattern = re.compile(r"(wlan|wifi|qca|cnss|icnss|supplicant|hostapd|\.ko$)", re.I)
          for part_name, part_root in partition_roots.items():
              matches = [str(p.relative_to(part_root)) for p in part_root.rglob("*") if p.is_file() and wlan_pattern.search(p.name)]
              add(f"| {part_name} | " + (", ".join(matches[:100]) if matches else "No filename matches") + " |")
          for part_name in ("boot", "vendor_boot"):
              p = Path("analysis") / part_name
              if p.exists():
                  add(f"- `{part_name}.img`: " + ("unpacked with unpack_bootimg when available." if (p / "unpacked").exists() else "image type recorded; ramdisk/kernel not unpacked."))
          add()
          add("## Kernel module compatibility")
          add()
          add("| Check | Result | Detail |")
          add("|---|---|---|")
          modules = list(vendor.rglob("*.ko")) + list(odm.rglob("*.ko"))
          qca = [p for p in modules if "qca_cld3" in p.name]
          check("QCA CLD3 module candidates discovered", bool(qca),
                ", ".join(str(p.relative_to(vendor if vendor in p.parents else odm)) for p in qca) if qca else "No qca_cld3 module found in vendor/ODM.")
          dep = vendor / "lib/modules/modules.dep"
          if dep.exists():
              deptext = text_file(dep)
              for module in qca:
                  key = module.name
                  line = next((x for x in deptext.splitlines() if x.startswith(key + ":") or x.endswith("/" + key + ":")), "")
                  deps = line.split(":",1)[1].strip().split() if line else []
                  absent = [d for d in deps if not (vendor / "lib/modules" / d).exists()]
                  check(f"{key} dependency closure", bool(line) and not absent,
                        "Dependencies recorded and present." if line and not absent else ("No modules.dep entry." if not line else "Missing dependencies: " + ", ".join(absent)))
          else:
              check("modules.dep dependency closure", False,
                    "modules.dep is absent in extracted vendor; module dependencies cannot be validated.")
          for module in qca:
              try:
                  info = subprocess.check_output(["modinfo", "-F", "vermagic", str(module)], text=True, stderr=subprocess.STDOUT).strip()
                  check(f"{module.name} vermagic", bool(info), info or "modinfo returned empty vermagic.")
              except Exception as e:
                  check(f"{module.name} vermagic", False, "modinfo failed: " + str(e))
          check("Recovery kernel ABI match", False,
                "Not proven by vendor/ODM images alone. Compare module vermagic and symbol dependencies against the exact kernel used by the recovery build.", "REVIEW")

          add()
          add("## Missing firmware partition coverage")
          add()
          assets = Path("firmware/release-assets.txt").read_text().splitlines()
          dlkm = [x for x in assets if any(k in x.lower() for k in ["vendor_dlkm","system_dlkm","odm_dlkm"])]
          check("DLKM images included in firmware release", bool(dlkm),
                ", ".join(dlkm) if dlkm else "Release does not publish separate vendor_dlkm/system_dlkm/odm_dlkm assets. WLAN modules may be stored there; this audit cannot rule out additional dependencies.", "REVIEW")

          add()
          add("## Findings summary")
          add()
          if findings:
              for severity, label, detail in findings:
                  add(f"- **{severity}: {label}** — {detail}")
          else:
              add("- No missing static checks detected. Hardware validation is still required.")
          add()
          add("## Interpretation")
          add()
          add("- **MISSING** means the file or integration check was not found.")
          add("- **REVIEW** means static analysis cannot establish compatibility; manual kernel/device validation is required.")
          add("- A passing file-presence check does not establish that the Wi-Fi driver initializes, firmware boots, supplicant scans, or DHCP works.")
          add("- Files found in system/product partitions are dependency evidence only; their presence does not automatically make them suitable for staging into recovery.")
          add()
          Path("reports/PIPA_WLAN_GAP_ANALYSIS.md").write_text("\n".join(report) + "\n")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text("\n".join(report))
          print(f"Report written. Findings: {len(findings)}")
          PY

      - name: Commit WLAN analysis results directly to repository
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "::warning::Skipping report commit because this run is not on a branch."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit the collected WLAN-related stock-ROM files plus reports.
          # Never commit the downloaded ROM, partition images, full extracted
          # Android filesystem trees, modem NV/EFS data, or rmt_storage.
          git add -f reports/PIPA_WLAN_GAP_ANALYSIS.md
          git add -f reports/PIPA_QCA6390_FIRMWARE_STAGING.md 2>/dev/null || true
          git add -f recovery/root/vendor/firmware/wlan/qca_cld/qca6390/ 2>/dev/null || true
          git add -f recovery/root/vendor/bin/cnss-daemon 2>/dev/null || true
          git add -f stock-rom-wlan/ 2>/dev/null || true
          if [ -f reports/PIPA_WLAN_STOCK_ROM_FILE_INVENTORY.md ]; then git add -f reports/PIPA_WLAN_STOCK_ROM_FILE_INVENTORY.md; fi
          for output in \
            firmware/source.txt \
            firmware/release-assets.txt \
            firmware/rom-image-list.txt \
            analysis/rom-image-inventory.txt \
            analysis/super-partition-inventory.txt \
            analysis/modem/modem-extraction.log \
            analysis/modem/modem-file-list.txt \
            analysis/raw-partition-scan-file-list.txt; do
            if [ -f "$output" ]; then git add -f "$output"; fi
          done

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "ci: collect WLAN files from all Pipa stock partitions"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Unmount extracted filesystem images
        if: always()
        run: |
          for part in vendor odm system system_ext product vendor_dlkm system_dlkm odm_dlkm; do sudo umount "analysis/$part" 2>/dev/null || true; done
          find analysis/modem -type d -name '*.mount' -print0 2>/dev/null | while IFS= read -r -d '' m; do sudo umount "$m" 2>/dev/null || true; done