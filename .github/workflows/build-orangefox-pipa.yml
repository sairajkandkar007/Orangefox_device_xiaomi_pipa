name: Build OrangeFox Recovery (Pipa)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: OrangeFox manifest branch
        required: true
        type: choice
        options:
          - "14.1"
        default: "14.1"
      build_target:
        description: Recovery build target
        required: true
        type: choice
        options:
          - recoveryimage
          - vendorbootimage
          - bootimage
        default: recoveryimage
      clean_build:
        description: Run installclean before building
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipa-orangefox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build OrangeFox for Xiaomi Pad 6 (Pipa)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      FOX_BRANCH: ${{ inputs.manifest_branch }}
      DEVICE_TREE_URL: https://github.com/${{ github.repository }}.git
      DEVICE_TREE_BRANCH: ${{ github.ref_name }}
      DEVICE_PATH: device/xiaomi/pipa
      DEVICE_NAME: pipa
      BUILD_TARGET: ${{ inputs.build_target }}

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: device-tree

      - name: Free runner disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install OrangeFox build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl
          sudo apt-get install -y zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386
          sudo apt-get install -y libncurses5-dev lib32ncurses-dev x11proto-core-dev
          sudo apt-get install -y libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils
          sudo apt-get install -y xsltproc unzip fontconfig python3 rsync bc ccache
          sudo apt-get install -y imagemagick libssl-dev libelf-dev lz4

      - name: Install repo launcher
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+rx "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize and shallow-sync OrangeFox sources
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"
          cd "$GITHUB_WORKSPACE/OrangeFox"
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git sync
          cd sync

          # The official helper performs OrangeFox manifest setup and source sync.
          # Inject repo's supported depth=1 option into its repo-init command so
          # the first manifest checkout is shallow rather than downloading full history.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("orangefox_sync.sh")
          data = p.read_text()
          updated, count = re.subn(r'(?m)(\\brepo\\s+init\\s+)(?!.*--depth)', r'\\1--depth=1 ', data)
          if count == 0:
              raise SystemExit("Could not locate repo init command in orangefox_sync.sh; refusing a non-shallow sync")
          p.write_text(updated)
          print(f"Added --depth=1 to {count} repo init command(s)")
          PY

          chmod +x ./orangefox_sync.sh
          ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$GITHUB_WORKSPACE/OrangeFox/fox_$FOX_BRANCH"

      - name: Install Pipa device tree
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/OrangeFox/fox_$FOX_BRANCH"
          mkdir -p "$SRC/$DEVICE_PATH"
          cp -a "$GITHUB_WORKSPACE/device-tree/." "$SRC/$DEVICE_PATH/"
          git -C "$GITHUB_WORKSPACE/device-tree" rev-parse HEAD > "$GITHUB_WORKSPACE/device-tree-commit.txt"

      - name: Build OrangeFox
        shell: bash
        run: |
          # Android envsetup uses temporarily-unset variables; do not enable nounset here.
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$FOX_BRANCH"
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch "fox_${DEVICE_NAME}-ap2a-eng"
          if [[ "${{ inputs.clean_build }}" == "true" ]]; then
            mka installclean
          fi
          mka -j"$(nproc --all)" "$BUILD_TARGET"

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pipa-build-output"
          SRC="$GITHUB_WORKSPACE/OrangeFox/fox_$FOX_BRANCH/out/target/product/$DEVICE_NAME"
          if [ -d "$SRC" ]; then
            find "$SRC" -maxdepth 2 -type f \( -name '*.img' -o -name '*.zip' -o -name '*.tar' \) -exec cp -v {} "$GITHUB_WORKSPACE/pipa-build-output/" \;
          fi
          cp -f "$GITHUB_WORKSPACE/device-tree-commit.txt" "$GITHUB_WORKSPACE/pipa-build-output/" 2>/dev/null || true

      - name: Upload recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Pipa-${{ github.run_number }}
          path: pipa-build-output/*
          if-no-files-found: warn
          retention-days: 14
